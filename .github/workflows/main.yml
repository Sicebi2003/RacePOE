name: RaceDay Build & Test CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore PATH_TO_YOUR_PROJECT/PROJECT_NAME.csproj

    - name: Build project
      run: dotnet build PATH_TO_YOUR_PROJECT/PROJECT_NAME.csproj --configuration Release --no-restore
